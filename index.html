<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Türkçe Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Üst Menü -->
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🎯</span>
            <h1 class="text-2xl font-bold text-amber-400" id="active-subject-title">Fiilimsiler</h1>
        </div>
        
        <!-- Mod Seçenekleri -->
        <div class="flex gap-3">
            <button onclick="switchTab('sunu')" id="btn-sunu" class="px-6 py-2.5 bg-blue-600 rounded-xl text-lg font-bold hover:bg-blue-500 transition">🖥️ Sunu (Tahta)</button>
            <button onclick="switchTab('yazmalik')" id="btn-yazmalik" class="px-6 py-2.5 bg-slate-700 rounded-xl text-lg font-bold hover:bg-slate-600 transition">📝 Deftere Yazmalık</button>
            <button onclick="switchTab('test')" id="btn-test" class="px-6 py-2.5 bg-slate-700 rounded-xl text-lg font-bold hover:bg-slate-600 transition">❓ İnteraktif Test</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- SOL MENÜ: TÜM KONULAR -->
        <aside class="w-80 bg-slate-800 border-r border-slate-700 p-4 overflow-y-auto">
            <h2 class="text-xl font-bold text-amber-400 mb-4 border-b border-slate-700 pb-2">📚 Ders Konuları</h2>
            <div id="topic-list" class="space-y-2">
                <!-- Konular JS ile listelenecek -->
            </div>
        </aside>

        <!-- İÇERİK ALANI -->
        <main class="flex-1 p-6 relative flex flex-col justify-center items-center bg-slate-900">

            <!-- 1. SUNU MODÜLÜ (Turkcedersi.net Embed) -->
            <div id="tab-sunu" class="tab-content w-full h-full bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 shadow-2xl flex flex-col">
                <iframe id="sunu-frame" src="" class="w-full h-full border-0" allowfullscreen></iframe>
            </div>

            <!-- 2. DEFTERE YAZMALIK MODÜLÜ -->
            <div id="tab-yazmalik" class="tab-content hidden w-full h-full bg-slate-800 rounded-2xl p-10 border border-slate-700 overflow-y-auto shadow-2xl">
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold text-amber-400 mb-6 border-b border-amber-400/30 pb-3">📌 Deftere Yazılacak Özet Notlar</h2>
                    <div id="yazmalik-content" class="space-y-6 text-2xl text-slate-200">
                        <!-- Yazmalık içerik -->
                    </div>
                </div>
            </div>

            <!-- 3. İNTERAKTİF TEST MODÜLÜ -->
            <div id="tab-test" class="tab-content hidden w-full h-full flex flex-col justify-center items-center bg-slate-800 rounded-2xl p-10 border border-slate-700 shadow-2xl">
                <div class="max-w-3xl w-full">
                    <h3 id="question-text" class="text-3xl font-bold mb-8 text-center text-slate-100">Soru yükleniyor...</h3>
                    <div id="options-container" class="grid grid-cols-1 gap-4">
                        <!-- Test içerik -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // TÜM KONULARIN VERİ TABANI
        const topics = [
            {
                id: "fiilimsiler",
                title: "8. Sınıf: Fiilimsiler",
                sunuUrl: "https://www.turkcedersi.net/fiilimsiler-konu-anlatimi/", // Doğrudan sunu adresi
                yazmalik: [
                    { title: "Fiilimsi Nedir?", desc: "Fiilden türeyen ancak fiil gibi çekimlenemeyen, cümle içinde isim, sıfat veya zarf görevinde kullanılan sözcüklerdir." },
                    { title: "Türleri", desc: "1. İsim-Fiil (-ma, -ış, -mak)<br>2. Sıfat-Fiil (-an, -ası, -mez, -ar, -dik, -ecek, -miş)<br>3. Zarf-Fiil (-ken, -alı, -asiye, -ince, -ip...)" }
                ],
                quiz: {
                    q: "Aşağıdakilerin hangisinde isim-fiil kullanılmıştır?",
                    options: ["Okumak en büyük tutkusudur.", "Koşarak eve gitti.", "Gelen adamı tanımıyorum.", "Gülünce gözlerinin içi güler."],
                    answer: 0
                }
            },
            {
                id: "isimler",
                title: "6. Sınıf: İsimler (Adlar)",
                sunuUrl: "https://www.turkcedersi.net/isimler-konu-anlatimi/",
                yazmalik: [
                    { title: "İsim Nedir?", desc: "Canlı ve cansız varlıkları, kavramları karşılayan kelimelerdir." }
                ],
                quiz: {
                    q: "Aşağıdakilerden hangisi özel isimdir?",
                    options: ["Kitap", "Ankara", "Masa", "Kedi"],
                    answer: 1
                }
            },
            {
                id: "sozcukte-anlam",
                title: "Tüm Sınıflar: Sözcükte Anlam",
                sunuUrl: "https://www.turkcedersi.net/sozcukte-anlam-konu-anlatimi/",
                yazmalik: [
                    { title: "Gerçek Anlam", desc: "Kelimenin akla gelen ilk anlamıdır." },
                    { title: "Mecaz Anlam", desc: "Kelimenin gerçek anlamından tamamen uzaklaşarak kazandığı yeni anlamdır." }
                ],
                quiz: {
                    q: "'Ağır' kelimesi hangisinde mecaz anlamda kullanılmıştır?",
                    options: ["Bu çanta çok ağır.", "Bize çok ağır sözler söyledi.", "Ağır taş yerinden oynamaz.", "Ağır yük taşıdı."],
                    answer: 1
                }
            }
        ];

        let currentTopic = topics[0];

        // Sol Menüyü Oluştur
        function renderSidebar() {
            const container = document.getElementById('topic-list');
            container.innerHTML = '';
            topics.forEach((topic, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl font-semibold transition ${topic.id === currentTopic.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 hover:bg-slate-600'}`;
                btn.innerText = topic.title;
                btn.onclick = () => selectTopic(idx);
                container.appendChild(btn);
            });
        }

        // Konu Seçimi
        function selectTopic(index) {
            currentTopic = topics[index];
            document.getElementById('active-subject-title').innerText = currentTopic.title;
            document.getElementById('sunu-frame').src = currentTopic.sunuUrl;
            
            renderSidebar();
            loadYazmalik();
            loadQuiz();
        }

        // Sekme Değiştirme
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            ['sunu', 'yazmalik', 'test'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                btn.className = t === tabName ? "px-6 py-2.5 bg-blue-600 rounded-xl text-lg font-bold hover:bg-blue-500 transition" : "px-6 py-2.5 bg-slate-700 rounded-xl text-lg font-bold hover:bg-slate-600 transition";
            });
        }

        // Yazmalık Yükle
        function loadYazmalik() {
            const container = document.getElementById('yazmalik-content');
            container.innerHTML = '';
            currentTopic.yazmalik.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-900/60 p-6 rounded-2xl border-l-8 border-amber-400 shadow";
                div.innerHTML = `<strong class="text-amber-300 block mb-2">${item.title}</strong>${item.desc}`;
                container.appendChild(div);
            });
        }

        // Test Yükle
        function loadQuiz() {
            const q = currentTopic.quiz;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "p-5 bg-slate-700 hover:bg-slate-600 text-2xl font-semibold rounded-xl text-left border border-slate-600 transition";
                btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
                btn.onclick = () => {
                    btn.className = idx === q.answer ? "p-5 bg-green-600 text-2xl font-semibold rounded-xl text-left border border-green-500" : "p-5 bg-red-600 text-2xl font-semibold rounded-xl text-left border border-red-500";
                };
                container.appendChild(btn);
            });
        }

        // Çalıştır
        renderSidebar();
        selectTopic(0);
    </script>
</body>
</html>
